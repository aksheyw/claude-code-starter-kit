<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 452" width="1040" height="452" role="img" aria-label="Two rows. Top row, without a front door: eight good Claude Code repos, each opening at a terminal command, with no order to read them in, so a newcomer installs all eight and understands none. Bottom row, with this kit: ten minutes of clicking to install the desktop app and choose a folder, then twelve guided steps that add an instructions file, up to eighteen rules, two or three plugins, one of which brings sixteen tool connections, up to twelve skills and a notebook, ending in one real piece of work. Everything else waits for a named moment, listed in GROWTH.md.">
  <title>Without a door versus day one</title>

  <rect width="1040" height="452" fill="#FFFFFF"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ROW 1: the dead path -->
    <text x="32" y="34" font-size="13" font-weight="700" fill="#8A8F98" letter-spacing="1.4">WITHOUT A DOOR</text>
    <text x="197" y="34" font-size="13" fill="#B9BEC6">eight good repos, no order to read them in</text>

    <rect x="32" y="50" width="976" height="118" rx="6" fill="#F5F6F7" stroke="#E3E6EA"/>

    <g font-size="11.5" fill="#8A8F98" text-anchor="middle">
      <rect x="50" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="103" y="91">rules</text>
      <rect x="164" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="217" y="91">skills</text>
      <rect x="278" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="331" y="91">pm-agents</text>
      <rect x="392" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="445" y="91">hooks</text>
      <rect x="50" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="103" y="133">ship-gate</text>
      <rect x="164" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="217" y="133">context-bridge</text>
      <rect x="278" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="331" y="133">deep-review</text>
      <rect x="392" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="445" y="133">backup</text>
    </g>

    <path d="M516 109 L568 109" stroke="#B9BEC6" stroke-width="1.5" fill="none"/>
    <path d="M563 105 L570 109 L563 113 Z" fill="#B9BEC6"/>

    <rect x="580" y="72" width="410" height="74" rx="5" fill="#FFFFFF" stroke="#D8DCE1"/>
    <text x="600" y="97" font-size="14" font-weight="600" fill="#5B6169">Installs all eight, understands none</text>
    <text x="600" y="120" font-size="12.5" fill="#8A8F98">Every README opens at a terminal command. None says</text>
    <text x="600" y="137" font-size="12.5" fill="#8A8F98">which to install first, or which to leave alone.</text>

    <!-- ROW 2: the live path -->
    <text x="32" y="212" font-size="13" font-weight="700" fill="#0B6E5F" letter-spacing="1.4">DAY ONE, WITH ONE</text>
    <text x="216" y="212" font-size="13" fill="#0E9384">10 minutes of clicking, then 12 guided steps, ending in something finished</text>

    <rect x="32" y="228" width="976" height="196" rx="6" fill="#E6F4F1" stroke="#BFE0DA"/>

    <g text-anchor="middle">
      <rect x="50" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="110" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">App and folder</text>
      <text x="110" y="291" font-size="11" fill="#5B6169">a normal Mac app.</text>
      <text x="110" y="304" font-size="11" fill="#5B6169">No terminal here.</text>

      <rect x="183" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="243" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">CLAUDE.md</text>
      <text x="243" y="291" font-size="11" fill="#5B6169">the page it reads</text>
      <text x="243" y="304" font-size="11" fill="#5B6169">every conversation</text>

      <rect x="316" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="376" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">Up to 18 rules</text>
      <text x="376" y="291" font-size="11" fill="#5B6169">9 for day one,</text>
      <text x="376" y="304" font-size="11" fill="#5B6169">the rest for later</text>

      <rect x="449" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="509" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">2 or 3 plugins</text>
      <text x="509" y="291" font-size="11" fill="#5B6169">one brings 16 tool</text>
      <text x="509" y="304" font-size="11" fill="#5B6169">connections</text>

      <rect x="582" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="642" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">Up to 12 skills</text>
      <text x="642" y="291" font-size="11" fill="#5B6169">most downloaded, so</text>
      <text x="642" y="304" font-size="11" fill="#5B6169">you can update them</text>

      <rect x="715" y="250" width="121" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="775" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">A notebook</text>
      <text x="775" y="291" font-size="11" fill="#5B6169">so the next chat</text>
      <text x="775" y="304" font-size="11" fill="#5B6169">knows this one</text>

      <rect x="848" y="250" width="141" height="62" rx="4" fill="#0E9384" stroke="#0B6E5F"/>
      <text x="918" y="274" font-size="12.5" font-weight="700" fill="#FFFFFF">One real thing</text>
      <text x="918" y="293" font-size="11" fill="#D5EDE8">a spec, a brief, a plan.</text>
      <text x="918" y="306" font-size="11" fill="#D5EDE8">Finished, not a demo.</text>
    </g>

    <g stroke="#0E9384" stroke-width="1.4" fill="none">
      <path d="M173 281 L178 281"/><path d="M306 281 L311 281"/><path d="M439 281 L444 281"/>
      <path d="M572 281 L577 281"/><path d="M705 281 L710 281"/><path d="M838 281 L843 281"/>
    </g>
    <g fill="#0E9384">
      <path d="M176 277 L183 281 L176 285 Z"/><path d="M309 277 L316 281 L309 285 Z"/>
      <path d="M442 277 L449 281 L442 285 Z"/><path d="M575 277 L582 281 L575 285 Z"/>
      <path d="M708 277 L715 281 L708 285 Z"/><path d="M841 277 L848 281 L841 285 Z"/>
    </g>

    <rect x="50" y="330" width="940" height="76" rx="5" fill="#FFFFFF" stroke="#9FD3CA"/>
    <text x="70" y="354" font-size="13" font-weight="600" fill="#1B2A4A">Day one installs from two of the eight repos. The rest wait behind a trigger.</text>
    <text x="70" y="376" font-size="12" fill="#5B6169">Version control, the first time Claude edits four files and you cannot get back. Secret scanning, the first time an app needs</text>
    <text x="70" y="393" font-size="12" fill="#5B6169">a paid API key. A push gate, the first time you ship without anyone checking. Named moments, not a list. GROWTH.md has them.</text>

  </g>
</svg>
