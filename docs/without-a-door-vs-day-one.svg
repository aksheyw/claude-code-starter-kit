<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 452" width="1040" height="452" role="img" aria-label="Without a front door, a newcomer meets eight separate Claude Code repos with no order and no starting point, installs all eight, understands none of them, and stops trusting the setup. With this kit, day one is ten minutes of clicking to install the Claude desktop app and pick one project folder where every change is shown before it happens, then nine guided steps in which Claude sets itself up: a CLAUDE.md, eighteen rules, two or three plugins bringing sixteen tool connections, and one real piece of work finished. Everything else stays locked behind a trigger, a specific moment that tells you when to add it, described in GROWTH.md.">
  <title>Without a door versus day one</title>

  <rect width="1040" height="452" fill="#FFFFFF"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ROW 1: the dead path -->
    <text x="32" y="34" font-size="13" font-weight="700" fill="#8A8F98" letter-spacing="1.4">WITHOUT A DOOR</text>
    <text x="197" y="34" font-size="13" fill="#B9BEC6">eight good repos, no order to read them in</text>

    <rect x="32" y="50" width="976" height="118" rx="6" fill="#F5F6F7" stroke="#E3E6EA"/>

    <g font-size="11.5" fill="#8A8F98" text-anchor="middle">
      <rect x="50" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="103" y="91">rules</text>
      <rect x="164" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="217" y="91">skills</text>
      <rect x="278" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="331" y="91">pm-agents</text>
      <rect x="392" y="70" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="445" y="91">hooks</text>
      <rect x="50" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="103" y="133">ship-gate</text>
      <rect x="164" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="217" y="133">context-bridge</text>
      <rect x="278" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="331" y="133">deep-review</text>
      <rect x="392" y="112" width="106" height="34" rx="4" fill="#FFFFFF" stroke="#D8DCE1"/><text x="445" y="133">backup</text>
    </g>

    <path d="M516 109 L568 109" stroke="#B9BEC6" stroke-width="1.5" fill="none"/>
    <path d="M563 105 L570 109 L563 113 Z" fill="#B9BEC6"/>

    <rect x="580" y="72" width="410" height="74" rx="5" fill="#FFFFFF" stroke="#D8DCE1"/>
    <text x="600" y="97" font-size="14" font-weight="600" fill="#5B6169">Installs all eight, understands none</text>
    <text x="600" y="120" font-size="12.5" fill="#8A8F98">Every README opens at a terminal command. None says</text>
    <text x="600" y="137" font-size="12.5" fill="#8A8F98">which to install first, or which to leave alone.</text>

    <!-- ROW 2: the live path -->
    <text x="32" y="212" font-size="13" font-weight="700" fill="#0B6E5F" letter-spacing="1.4">DAY ONE, WITH ONE</text>
    <text x="216" y="212" font-size="13" fill="#0E9384">10 minutes of clicking, then 9 guided steps, ending in something finished</text>

    <rect x="32" y="228" width="976" height="196" rx="6" fill="#E6F4F1" stroke="#BFE0DA"/>

    <g text-anchor="middle">
      <rect x="50" y="250" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="120" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">Install the app</text>
      <text x="120" y="291" font-size="11" fill="#5B6169">a normal Mac app.</text>
      <text x="120" y="304" font-size="11" fill="#5B6169">No terminal at all.</text>

      <rect x="206" y="250" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="276" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">One folder</text>
      <text x="276" y="291" font-size="11" fill="#5B6169">every change shown</text>
      <text x="276" y="304" font-size="11" fill="#5B6169">before it happens</text>

      <rect x="362" y="250" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="432" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">CLAUDE.md</text>
      <text x="432" y="291" font-size="11" fill="#5B6169">the page it reads</text>
      <text x="432" y="304" font-size="11" fill="#5B6169">every conversation</text>

      <rect x="518" y="250" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="588" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">18 rules</text>
      <text x="588" y="291" font-size="11" fill="#5B6169">9 for day one,</text>
      <text x="588" y="304" font-size="11" fill="#5B6169">the rest wait</text>

      <rect x="674" y="250" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#9FD3CA"/>
      <text x="744" y="272" font-size="12.5" font-weight="600" fill="#1B2A4A">2 or 3 plugins</text>
      <text x="744" y="291" font-size="11" fill="#5B6169">bringing 16 tool</text>
      <text x="744" y="304" font-size="11" fill="#5B6169">connections with them</text>

      <rect x="830" y="250" width="160" height="62" rx="4" fill="#0E9384" stroke="#0B6E5F"/>
      <text x="910" y="274" font-size="12.5" font-weight="700" fill="#FFFFFF">One real thing</text>
      <text x="910" y="293" font-size="11" fill="#D5EDE8">a spec, a brief, a plan.</text>
      <text x="910" y="306" font-size="11" fill="#D5EDE8">Finished, not a demo.</text>
    </g>

    <g stroke="#0E9384" stroke-width="1.4" fill="none">
      <path d="M192 281 L204 281"/><path d="M348 281 L360 281"/><path d="M504 281 L516 281"/>
      <path d="M660 281 L672 281"/><path d="M816 281 L828 281"/>
    </g>
    <g fill="#0E9384">
      <path d="M199 277 L206 281 L199 285 Z"/><path d="M355 277 L362 281 L355 285 Z"/>
      <path d="M511 277 L518 281 L511 285 Z"/><path d="M667 277 L674 281 L667 285 Z"/>
      <path d="M823 277 L830 281 L823 285 Z"/>
    </g>

    <rect x="50" y="330" width="940" height="76" rx="5" fill="#FFFFFF" stroke="#9FD3CA"/>
    <text x="70" y="354" font-size="13" font-weight="600" fill="#1B2A4A">The other eight repos are still there. Each one waits behind a trigger.</text>
    <text x="70" y="376" font-size="12" fill="#5B6169">Version control, the first time Claude edits four files and you cannot get back. Secret scanning, the first time an app needs</text>
    <text x="70" y="393" font-size="12" fill="#5B6169">a paid API key. A push gate, the first time you ship without anyone checking. Named moments, not a list. GROWTH.md has them.</text>

  </g>
</svg>
